<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada (404) | Israel Torres</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08101E" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #08101E;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .badge {
        font-family: monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #E2B259;
        border: 1px solid rgba(226, 178, 89, 0.4);
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(226, 178, 89, 0.1);
        margin-bottom: 16px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin: 0 0 12px 0;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        color: #94A3B8;
        max-width: 480px;
        line-height: 1.6;
        margin: 0 0 28px 0;
        font-size: 15px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 8px;
        background-color: #C58A24;
        color: #08101E;
        font-weight: 700;
        text-decoration: none;
        font-size: 14px;
        transition: transform 0.2s, background-color 0.2s;
      }
      a.btn:hover {
        background-color: #E2B259;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <span class="badge">Error 404</span>
    <h1>Página no encontrada</h1>
    <p>El enlace solicitado no existe o fue movido. Puedes regresar a la página principal de Israel Torres para consultar su perfil profesional.</p>
    <a href="/" class="btn">Volver al inicio de Israel Torres →</a>
  </body>
</html>
